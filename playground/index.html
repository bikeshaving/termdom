 1ch; }\n  .braille { color: magenta; display: inline; }\n  .clock { color: cyan; display: inline; }\n  .bounce { color: red; display: inline; white-space: pre; }\n  .status { color: #666; padding-top: 1px; }\n`;\ndocument.head.appendChild(style);\n\nconst app = document.createElement(\"div\");\napp.className = \"app\";\n\nconst title = document.createElement(\"h2\");\ntitle.className = \"title\";\ntitle.textContent = \"Terminal Animations\";\napp.appendChild(title);\n\n// Spinner\nconst spinnerSection = document.createElement(\"div\");\nspinnerSection.className = \"section\";\nconst spinnerLabel = document.createElement(\"span\");\nspinnerLabel.className = \"label\";\nspinnerLabel.textContent = \"Spinner:    \";\nconst spinner = document.createElement(\"span\");\nspinner.className = \"spinner\";\nspinnerSection.appendChild(spinnerLabel);\nspinnerSection.appendChild(spinner);\napp.appendChild(spinnerSection);\n\n// Dots loader\nconst dotsSection = document.createElement(\"div\");\ndotsSection.className = \"section\";\nconst dotsLabel = document.createElement(\"span\");\ndotsLabel.className = \"label\";\ndotsLabel.textContent = \"Loading:    \";\nconst dots = document.createElement(\"span\");\ndots.className = \"dots\";\ndotsSection.appendChild(dotsLabel);\ndotsSection.appendChild(dots);\napp.appendChild(dotsSection);\n\n// Progress bar\nconst barSection = document.createElement(\"div\");\nbarSection.className = \"section\";\nconst barLabel = document.createElement(\"span\");\nbarLabel.className = \"label\";\nbarLabel.textContent = \"Progress:   \";\nconst barContainer = document.createElement(\"div\");\nbarContainer.className = \"bar-container\";\nconst barFill = document.createElement(\"span\");\nbarFill.className = \"bar-fill\";\nconst barTrack = document.createElement(\"span\");\nbarTrack.className = \"bar-track\";\nconst barPct = document.createElement(\"span\");\nbarPct.className = \"bar-pct\";\nbarContainer.appendChild(barFill);\nbarContainer.appendChild(barTrack);\nbarContainer.appendChild(barPct);\nbarSection.appendChild(barLabel);\nbarSection.appendChild(barContainer);\napp.appendChild(barSection);\n\n// Braille spinner\nconst brailleSection = document.createElement(\"div\");\nbrailleSection.className = \"section\";\nconst brailleLabel = document.createElement(\"span\");\nbrailleLabel.className = \"label\";\nbrailleLabel.textContent = \"Braille:    \";\nconst braille = document.createElement(\"span\");\nbraille.className = \"braille\";\nbrailleSection.appendChild(brailleLabel);\nbrailleSection.appendChild(braille);\napp.appendChild(brailleSection);\n\n// Clock\nconst clockSection = document.createElement(\"div\");\nclockSection.className = \"section\";\nconst clockLabel = document.createElement(\"span\");\nclockLabel.className = \"label\";\nclockLabel.textContent = \"Clock:      \";\nconst clock = document.createElement(\"span\");\nclock.className = \"clock\";\nclockSection.appendChild(clockLabel);\nclockSection.appendChild(clock);\napp.appendChild(clockSection);\n\n// Bouncing ball\nconst bounceSection = document.createElement(\"div\");\nbounceSection.className = \"section\";\nconst bounceLabel = document.createElement(\"span\");\nbounceLabel.className = \"label\";\nbounceLabel.textContent = \"Bounce:     \";\nconst bounce = document.createElement(\"span\");\nbounce.className = \"bounce\";\nbounceSection.appendChild(bounceLabel);\nbounceSection.appendChild(bounce);\napp.appendChild(bounceSection);\n\n// Status\nconst status = document.createElement(\"div\");\nstatus.className = \"status\";\nstatus.textContent = \"Press q to quit\";\napp.appendChild(status);\n\ndocument.body.appendChild(app);\n\n// Animation state\nconst spinnerFrames = [\"⠋\", \"⠙\", \"⠹\", \"⠸\", \"⠼\", \"⠴\", \"⠦\", \"⠧\", \"⠇\", \"⠏\"];\nconst brailleFrames = [\"⣾\", \"⣽\", \"⣻\", \"⢿\", \"⡿\", \"⣟\", \"⣯\", \"⣷\"];\nconst clockFrames = [\n\t\"🕐\",\n\t\"🕑\",\n\t\"🕒\",\n\t\"🕓\",\n\t\"🕔\",\n\t\"🕕\",\n\t\"🕖\",\n\t\"🕗\",\n\t\"🕘\",\n\t\"🕙\",\n\t\"🕚\",\n\t\"🕛\",\n];\nlet frame = 0;\nlet progress = 0;\nlet bouncePos = 0;\nlet bounceDir = 1;\nconst bounceWidth = 20;\n\nfunction updateAnimations(): void {\n\t// Spinner\n\tspinner.textContent =\n\t\tspinnerFrames[frame % spinnerFrames.length] + \" Processing...\";\n\n\t// Dots\n\tconst dotCount = frame % 4;\n\tdots.textContent =\n\t\t\"Please wait\" + \".\".repeat(dotCount) + \" \".repeat(3 - dotCount);\n\n\t// Progress bar\n\tconst barWidth = 30;\n\tconst filled = Math.round((progress / 100) * barWidth);\n\tbarFill.textContent = \"█\".repeat(filled);\n\tbarTrack.textContent = \"░\".repeat(barWidth - filled);\n\tbarPct.textContent = `${Math.round(progress)}%`;\n\tprogress = (progress + 0.5) % 101;\n\n\t// Braille spinner\n\tbraille.textContent =\n\t\tbrailleFrames[frame % brailleFrames.length] + \" Computing...\";\n\n\t// Clock\n\tclock.textContent = clockFrames[frame % clockFrames.length];\n\n\t// Bouncing ball\n\tbounce.textContent =\n\t\t\" \".repeat(bouncePos) + \"●\" + \" \".repeat(bounceWidth - bouncePos);\n\tbouncePos += bounceDir;\n\tif (bouncePos >= bounceWidth || bouncePos \u003c= 0) {\n\t\tbounceDir *= -1;\n\t}\n\n\tframe++;\n}\n\n// Keyboard handler\ndocument.addEventListener(\"keydown\", (e: Event) => {\n\tconst ke = e as KeyboardEvent;\n\tif (ke.key === \"q\") {\n\t\tclearInterval(interval);\n\t\tterm.window.close();\n\t}\n});\n\n// Start animation loop\nconst interval = setInterval(updateAnimations, 80);\nupdateAnimations();\n"},{"id":"bar-chart","label":"bar-chart.ts","code":"import {TermDOM} from \"@b9g/termdom\";\n\nconst term = new TermDOM();\nterm.attach();\n\nconst {document} = term;\ndocument.body.innerHTML = `\n  \u003cstyle>\n    .chart { border: 1px solid #5fafff; padding: 0 1ch; width: 46ch; }\n    .title { color: #5fafff; font-weight: bold; }\n    .row { display: flex; }\n    .label { width: 10ch; color: #888; }\n    .bar { background-color: #5fafff; }\n    .row:nth-of-type(2) .bar { background-color: green; }\n    .row:nth-of-type(3) .bar { background-color: #cc99cd; }\n    .row:nth-of-type(4) .bar { background-color: #f0a45d; }\n    .value { margin-left: 1ch; color: #888; }\n  \u003c/style>\n  \u003cdiv class=\"chart\">\n    \u003cdiv class=\"title\">Requests per region\u003c/div>\n  \u003c/div>\n`;\n\nconst chart = document.querySelector(\".chart\")!;\nconst regions = [\n\t{name: \"us-east\", requests: 18},\n\t{name: \"eu-west\", requests: 12},\n\t{name: \"ap-south\", requests: 7},\n\t{name: \"sa-east\", requests: 3},\n];\n\nconst bars = regions.map((region) => {\n\tconst row = document.createElement(\"div\");\n\trow.className = \"row\";\n\trow.innerHTML = `\n\t\t\u003cspan class=\"label\">${region.name}\u003c/span>\n\t\t\u003cdiv class=\"bar\">\u003c/div>\n\t\t\u003cspan class=\"value\">\u003c/span>\n\t`;\n\tchart.appendChild(row);\n\treturn {\n\t\tregion,\n\t\tbar: row.querySelector(\".bar\") as HTMLElement,\n\t\tvalue: row.querySelector(\".value\") as HTMLElement,\n\t};\n});\n\nsetInterval(() => {\n\tfor (const {region, bar, value} of bars) {\n\t\tregion.requests = Math.max(\n\t\t\t1,\n\t\t\tMath.min(24, region.requests + Math.floor(Math.random() * 3) - 1),\n\t\t);\n\t\tbar.style.width = region.requests + \"ch\";\n\t\tvalue.textContent = String(region.requests * 41);\n\t}\n}, 300);\n"},{"id":"borders","label":"borders.ts","code":"import {TermDOM} from \"@b9g/termdom\";\n\nconst term = new TermDOM();\n\nterm.attach();\nconst {document} = term;\n\nconst style = document.createElement(\"style\");\nfunction edge(kind: string): string {\n\treturn `border: 1px ${kind};`;\n}\nstyle.textContent = `\n  .app { padding: 1 2ch; }\n  h2 { color: cyan; }\n  .label { color: #888; padding: 1 0 0 0; }\n  .gallery { display: flex; flex-direction: row; gap: 2ch; }\n  .swatch { padding: 0 1ch; width: 12ch; }\n  .solid  { ${edge(\"solid\")}  color: white; }\n  .double { ${edge(\"double\")} color: lightgreen; }\n  .dashed { ${edge(\"dashed\")} color: lightblue; }\n  .dotted { ${edge(\"dotted\")} color: yellow; }\n  .groove { ${edge(\"groove\")} color: plum; } /* groove renders the heavy charset */\n\n  /* A 2x2 grid of boxes, each overlapping its neighbors by one cell, so\n     every shared edge is ONE line and every meeting point a junction:\n     corners, ├ ┬ ┤ ┴ on the sides, ┼ in the middle. */\n  .grid { position: relative; height: 5px; width: 23ch; color: white; }\n  .grid div { position: absolute; ${edge(\"solid\")} width: 12ch; height: 3px; padding: 0 1ch; }\n  .nw { top: 0;   left: 0; }\n  .ne { top: 0;   left: 11ch; }\n  .sw { top: 2px; left: 0; }\n  .se { top: 2px; left: 11ch; }\n`;\ndocument.head.appendChild(style);\n\nconst app = document.createElement(\"div\");\napp.className = \"app\";\napp.innerHTML = `\n  \u003ch2>Borders\u003c/h2>\n  \u003cdiv class=\"label\">charsets\u003c/div>\n  \u003cdiv class=\"gallery\">\u003cdiv class=\"swatch solid\">solid\u003c/div>\u003cdiv class=\"swatch double\">double\u003c/div>\u003cdiv class=\"swatch dashed\">dashed\u003c/div>\u003cdiv class=\"swatch dotted\">dotted\u003c/div>\u003cdiv class=\"swatch groove\">groove\u003c/div>\u003c/div>\n  \u003cdiv class=\"label\">shared edges merge: ├ ┬ ┼ ┤ ┴ from four overlapping boxes\u003c/div>\n  \u003cdiv class=\"grid\">\u003cdiv class=\"nw\">NW\u003c/div>\u003cdiv class=\"ne\">NE\u003c/div>\u003cdiv class=\"sw\">SW\u003c/div>\u003cdiv class=\"se\">SE\u003c/div>\u003c/div>\n`;\ndocument.body.appendChild(app);\n"},{"id":"chat","label":"chat.ts","code":"// A chat client for ch.at (an LLM reachable over plain HTTP)\nimport {TermDOM} from \"@b9g/termdom\";\n\nconst term = new TermDOM();\n\nterm.attach();\nconst {document} = term;\n\nconst style = document.createElement(\"style\");\nstyle.textContent = `\n\t.title { color: cyan; font-weight: bold; }\n\t.hint { color: #666666; margin-bottom: 1px; }\n\t.msg { margin-top: 1px; }\n\t.msg .who { font-weight: bold; }\n\t.msg.you .who { color: #5fafff; }\n\t.msg.bot .who { color: #87d787; }\n\t.msg .body { display: block; }\n\t.msg.pending .body { color: #808080; }\n\t.prompt { display: flex; flex-direction: row; margin-top: 1px; }\n\t.prompt .sigil { color: #ff8700; font-weight: bold; }\n\t/* Flat like the UA's input family: the › sigil is the prompt chrome, so\n\t   the UA border box around the composer read as a second, mismatched\n\t   frame. Borderless, rows=1 sizes the content: one row until the text\n\t   wraps. */\n\ttextarea { flex-grow: 1; border: none; padding: 0; }\n`;\ndocument.head.appendChild(style);\n\nconst title = document.createElement(\"div\");\ntitle.className = \"title\";\ntitle.textContent = \" ch.at\";\nconst hint = document.createElement(\"div\");\nhint.className = \"hint\";\nhint.textContent = \" ask anything · Enter send · Ctrl+J newline · Esc quit\";\nconst log = document.createElement(\"div\");\nconst prompt = document.createElement(\"div\");\nprompt.className = \"prompt\";\nconst sigil = document.createElement(\"span\");\nsigil.className = \"sigil\";\nsigil.textContent = \"› \";\nconst input = document.createElement(\"textarea\");\ninput.autofocus = true;\ninput.setAttribute(\"rows\", \"1\");\ninput.setAttribute(\"placeholder\", \"message ch.at…\");\nprompt.append(sigil, input);\ndocument.body.append(title, hint, log, prompt);\n\ninterface Turn {\n\trole: \"user\" | \"assistant\";\n\ttext: string;\n}\nconst turns: Turn[] = [];\n\nfunction addMessage(role: \"user\" | \"assistant\", text: string): Text {\n\tconst msg = document.createElement(\"div\");\n\tmsg.className = `msg ${role === \"user\" ? \"you\" : \"bot\"}`;\n\tconst who = document.createElement(\"span\");\n\twho.className = \"who\";\n\twho.textContent = role === \"user\" ? \"you  \" : \"ch.at  \";\n\tconst body = document.createElement(\"span\");\n\tbody.className = \"body\";\n\tconst node = document.createTextNode(text);\n\tbody.appendChild(node);\n\tmsg.append(who, body);\n\tlog.appendChild(msg);\n\treturn node;\n}\n\nfunction scrollToPrompt(): void {\n\tprompt.scrollIntoView();\n}\n\n// The reply is streamed. ch.at echoes the whole prompt as `Q: ...` then adds a\n// final `A: \u003canswer>` line, so the answer is whatever follows the LAST `\\nA: `\n// the server appends (our own turns are labelled User:/Assistant:, never A:).\nfunction answerFrom(raw: string): string {\n\tconst marker = raw.lastIndexOf(\"\\nA: \");\n\treturn marker >= 0 ? raw.slice(marker + 4) : \"\";\n}\n\nlet busy = false;\n\nasync function send(): Promise\u003cvoid> {\n\tconst text = input.value.trim();\n\tif (busy || !text) {\n\t\treturn;\n\t}\n\tbusy = true;\n\tinput.value = \"\";\n\tturns.push({role: \"user\", text});\n\taddMessage(\"user\", text);\n\n\tconst bot = addMessage(\"assistant\", \"…\");\n\tconst botMsg = bot.parentElement!.parentElement as HTMLElement;\n\tbotMsg.classList.add(\"pending\");\n\tscrollToPrompt();\n\n\tconst conversation = turns\n\t\t.map((t) => `${t.role === \"user\" ? \"User\" : \"Assistant\"}: ${t.text}`)\n\t\t.join(\"\\n\");\n\tconst url = `https://ch.at/?q=${encodeURIComponent(conversation)}`;\n\n\ttry {\n\t\tconst controller = new AbortController();\n\t\tconst timeout = setTimeout(() => controller.abort(), 60000);\n\t\tconst res = await fetch(url, {signal: controller.signal});\n\t\tif (!res.ok || !res.body) {\n\t\t\tthrow new Error(`HTTP ${res.status}`);\n\t\t}\n\t\tconst reader = res.body.getReader();\n\t\tconst decoder = new TextDecoder();\n\t\tlet raw = \"\";\n\t\tfor (;;) {\n\t\t\tconst {done, value} = await reader.read();\n\t\t\tif (done) {\n\t\t\t\tbreak;\n\t\t\t}\n\t\t\traw += decoder.decode(value, {stream: true});\n\t\t\tconst answer = answerFrom(raw);\n\t\t\tif (answer) {\n\t\t\t\tbotMsg.classList.remove(\"pending\");\n\t\t\t\tbot.data = answer;\n\t\t\t\tscrollToPrompt();\n\t\t\t}\n\t\t}\n\t\tclearTimeout(timeout);\n\t\tconst answer = answerFrom(raw).trim() || \"(no answer)\";\n\t\tbot.data = answer;\n\t\tbotMsg.classList.remove(\"pending\");\n\t\tturns.push({role: \"assistant\", text: answer});\n\t} catch (err) {\n\t\tbotMsg.classList.remove(\"pending\");\n\t\tbot.data = `⚠ ${(err as Error).message}`;\n\t\tturns.pop(); // drop the user turn whose reply failed, so context stays clean\n\t} finally {\n\t\tbusy = false;\n\t\tscrollToPrompt();\n\t}\n}\n\n// Capture phase, so preventDefault runs BEFORE the textarea's own keydown and\n// suppresses the newline it would otherwise insert: Enter sends the message,\n// and Ctrl+J adds a line to a multi-line one. A terminal cannot report\n// Shift+Enter -- it sends the same byte as Enter -- so the newline lives on the\n// chord it can report.\ndocument.addEventListener(\n\t\"keydown\",\n\t(event: Event) => {\n\t\tconst e = event as KeyboardEvent;\n\t\tif (e.key === \"Escape\" || (e.ctrlKey && e.key === \"c\")) {\n\t\t\tterm.window.close();\n\t\t} else if (e.ctrlKey && e.key === \"j\") {\n\t\t\te.preventDefault();\n\t\t\tconst at = input.selectionStart ?? input.value.length;\n\t\t\tinput.value = input.value.slice(0, at) + \"\\n\" + input.value.slice(at);\n\t\t\tinput.setSelectionRange(at + 1, at + 1);\n\t\t} else if (e.key === \"Enter\" && !e.shiftKey) {\n\t\t\te.preventDefault();\n\t\t\tvoid send();\n\t\t}\n\t},\n\ttrue,\n);\n\nscrollToPrompt();\n\n// No terminal (piped/CI): run one scripted exchange so the example is testable\n// and inspectable without typing, then exit.\nif (!process.stdout.isTTY) {\n\tinput.value = \"In one short sentence, what is a terminal emulator?\";\n\tawait send();\n\tterm.window.close();\n}\n"},{"id":"commit-editor","label":"commit-editor.ts","code":"// A commit-message composer: one \u003cselect>, one \u003cinput>, one \u003ctextarea> --\n// all three form widgets, each rendering through its UA-internal shadow\n// tree. Nothing here is a special mode: the select's label and ▾, the\n// input's placeholder and faint blank, and the textarea's soft-wrapped\n// multiline value are all real DOM styled by real (UA and author) CSS.\n//\n// The textarea is the star: newlines are hard breaks, long lines soft-wrap\n// at the field edge (white-space: pre-wrap), the box grows with the text,\n// and Up/Down walk VISUAL lines with the browser's goal-column memory.\n// The \u003cinput> stays single-line by spec -- assigning it a value with a\n// newline strips it, which is exactly why \u003ctextarea> exists.\n//\n//   node examples/commit-editor.ts\n//\n//   Tab/Shift+Tab  move between fields\n//   ↑/↓            change type (in select) / move by line (in textarea)\n//   Enter          newline (in textarea)\n//   Ctrl+C         quit\n\nimport {TermDOM} from \"@b9g/termdom\";\n\nconst term = new TermDOM();\n\nterm.attach();\nconst {document} = term;\n\nconst style = document.createElement(\"style\");\nstyle.textContent = `\n  .editor { padding: 1 2ch; }\n  .title { color: cyan; font-weight: bold; }\n  .row { display: flex; flex-direction: row; gap: 1ch; padding: 1 0 0 0; }\n  .label { color: #888; width: 9ch; }\n  input#subject { width: 50ch; }\n  textarea#body { width: 62ch; }\n  textarea#body::placeholder { color: #556; }\n  .counter { color: #666; }\n  .counter.over { color: red; font-weight: bold; }\n  .status { color: #888; padding: 1 0 0 0; }\n  .hint { color: #666; padding: 1 0 0 0; }\n`;\ndocument.head.appendChild(style);\n\nconst editor = document.createElement(\"div\");\neditor.className = \"editor\";\neditor.innerHTML = `\n  \u003cdiv class=\"title\">Compose commit\u003c/div>\n  \u003cdiv class=\"row\">\u003cdiv class=\"label\">Type\u003c/div>\u003cselect id=\"type\">\u003coption value=\"feat\">feat\u003c/option>\u003coption value=\"fix\">fix\u003c/option>\u003coption value=\"docs\">docs\u003c/option>\u003coption value=\"refactor\">refactor\u003c/option>\u003coption value=\"test\">test\u003c/option>\u003coption value=\"chore\">chore\u003c/option>\u003c/select>\u003cdiv class=\"counter\" id=\"counter\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"row\">\u003cdiv class=\"label\">Subject\u003c/div>\u003cinput id=\"subject\" autofocus placeholder=\"imperative, ≤50 chars, no period\">\u003c/div>\n  \u003cdiv class=\"row\">\u003cdiv class=\"label\">Body\u003c/div>\u003ctextarea id=\"body\" rows=\"5\" cols=\"60\" placeholder=\"What and why -- wrapped for you at the field edge; blank line between paragraphs.\">\u003c/textarea>\u003c/div>\n  \u003cdiv class=\"status\" id=\"status\">\u003c/div>\n  \u003cdiv class=\"hint\">tab moves · ↑/↓ changes type / walks lines · ctrl+c quits\u003c/div>\n`;\ndocument.body.appendChild(editor);\n\nconst type = document.getElementById(\"type\") as HTMLSelectElement;\nconst subject = document.getElementById(\"subject\") as HTMLInputElement;\nconst body = document.getElementById(\"body\") as HTMLTextAreaElement;\nconst counter = document.getElementById(\"counter\")!;\nconst status = document.getElementById(\"status\")!;\n\nfunction update(): void {\n\tconst headline = `${type.value}: ${subject.value}`;\n\tconst over = headline.length > 50;\n\tcounter.textContent = `${headline.length}/50`;\n\tcounter.className = over ? \"counter over\" : \"counter\";\n\tconst bodyLines = body.value ? body.value.split(\"\\n\").length : 0;\n\tconst bodyNote = bodyLines ?\n\t\t`  (+${bodyLines} body line${bodyLines === 1 ? \"\" : \"s\"})` :\n\t\t\"\";\n\tstatus.textContent = subject.value ? `→ ${headline}${bodyNote}` : \"\";\n}\n\ntype.addEventListener(\"change\", update);\nsubject.addEventListener(\"input\", update);\nbody.addEventListener(\"input\", update);\nupdate();\n"},{"id":"flexbox","label":"flexbox.ts","code":"import {TermDOM} from \"@b9g/termdom\";\nconst term = new TermDOM();\nterm.attach();\nconst {document} = term;\n\nconst mainContainer = document.createElement(\"div\");\nmainContainer.style.display = \"flex\";\nmainContainer.style.flexDirection = \"column\";\nmainContainer.style.padding = \"1px 2px\";\nmainContainer.style.backgroundColor = \"darkblue\";\ndocument.body.appendChild(mainContainer);\n\nconst header = document.createElement(\"div\");\nheader.style.display = \"flex\";\nheader.style.flexDirection = \"row\";\nheader.style.justifyContent = \"space-between\";\nheader.style.backgroundColor = \"magenta\";\nheader.style.padding = \"1px 1px 1px 1px\";\nmainContainer.appendChild(header);\n\nconst headerTitle = document.createElement(\"span\");\nheaderTitle.textContent = \"🚀 TermDOM flexbox\";\nheaderTitle.style.color = \"white\";\nheader.appendChild(headerTitle);\n\nconst headerSubtitle = document.createElement(\"span\");\nheaderSubtitle.textContent = \"HTML · CSS · DOM → cells\";\nheaderSubtitle.style.textAlign = \"right\";\nheaderSubtitle.style.color = \"white\";\nheader.appendChild(headerSubtitle);\n\nconst contentArea = document.createElement(\"div\");\ncontentArea.style.display = \"flex\";\ncontentArea.style.flexDirection = \"row\";\ncontentArea.style.padding = \"1px 0 0\";\nmainContainer.appendChild(contentArea);\n\nconst sidebar = document.createElement(\"div\");\nsidebar.style.display = \"flex\";\nsidebar.style.flexDirection = \"column\";\nsidebar.style.backgroundColor = \"darkgreen\";\nsidebar.style.padding = \"1px\";\nsidebar.style.whiteSpace = \"nowrap\";\nsidebar.style.flexShrink = \"0\";\ncontentArea.appendChild(sidebar);\n\nconst sidebarTitle = document.createElement(\"span\");\nsidebarTitle.textContent = \"📋 Navigation\";\nsidebarTitle.style.color = \"white\";\nsidebarTitle.style.textAlign = \"center\";\nsidebar.appendChild(sidebarTitle);\n\nconst menuItems = [\"• Home\", \"• About\", \"• Services\", \"• Contact\"];\nfor (const item of menuItems) {\n\tconst menuItem = document.createElement(\"span\");\n\tmenuItem.textContent = item;\n\tmenuItem.style.color = \"white\";\n\tmenuItem.style.padding = \"0px 1px 0px 1px\";\n\tsidebar.appendChild(menuItem);\n}\n\nconst mainContent = document.createElement(\"div\");\nmainContent.style.display = \"flex\";\nmainContent.style.flexDirection = \"column\";\nmainContent.style.backgroundColor = \"darkgray\";\nmainContent.style.padding = \"1px 2px 1px 2px\";\ncontentArea.appendChild(mainContent);\n\nconst contentTitle = document.createElement(\"span\");\ncontentTitle.textContent = \"📄 Main Content Area\";\ncontentTitle.style.color = \"white\";\ncontentTitle.style.textAlign = \"center\";\nmainContent.appendChild(contentTitle);\n\nconst contentText = document.createElement(\"span\");\ncontentText.textContent =\n\t\"Flex rows and columns, gap, grow and shrink -- resolved by a spec flexbox engine and painted to whole cells. Multi-line markup lays out as in a browser: whitespace between items is not an item.\";\ncontentText.style.color = \"white\";\ncontentText.style.padding = \"1px 0px 1px 0px\";\nmainContent.appendChild(contentText);\n\nconst featuresContainer = document.createElement(\"div\");\nfeaturesContainer.style.display = \"flex\";\nfeaturesContainer.style.flexDirection = \"row\";\nfeaturesContainer.style.padding = \"1px 0px 0px 0px\";\nmainContent.appendChild(featuresContainer);\n\nconst features = [\n\t{title: \"🎨 Styling\", desc: \"One cascade: sheets, inline, var(), :has()\"},\n\t{title: \"📐 Layout\", desc: \"Flex, tables, margin collapsing\"},\n\t{title: \"🧩 Widgets\", desc: \"Inputs and selects as UA shadow trees\"},\n];\n\nfor (const feature of features) {\n\tconst featureCard = document.createElement(\"div\");\n\tfeatureCard.style.display = \"flex\";\n\tfeatureCard.style.flexDirection = \"column\";\n\tfeatureCard.style.backgroundColor = \"darkcyan\";\n\tfeatureCard.style.padding = \"1px 1px 1px 1px\";\n\tfeatureCard.style.flex = \"1\";\n\tfeaturesContainer.appendChild(featureCard);\n\n\tconst featureTitle = document.createElement(\"span\");\n\tfeatureTitle.textContent = feature.title;\n\tfeatureTitle.style.color = \"white\";\n\tfeatureTitle.style.textAlign = \"center\";\n\tfeatureCard.appendChild(featureTitle);\n\n\tconst featureDesc = document.createElement(\"span\");\n\tfeatureDesc.textContent = feature.desc;\n\tfeatureDesc.style.color = \"white\";\n\tfeatureDesc.style.textAlign = \"center\";\n\tfeatureCard.appendChild(featureDesc);\n}\n\nconst footer = document.createElement(\"div\");\nfooter.style.display = \"flex\";\nfooter.style.flexDirection = \"row-reverse\";\nfooter.style.backgroundColor = \"darkred\";\nfooter.style.padding = \"1px 2px 1px 2px\";\nmainContainer.appendChild(footer);\n\nconst footerText = document.createElement(\"span\");\nfooterText.textContent = \"© 2026 TermDOM\";\nfooterText.style.color = \"white\";\nfooter.appendChild(footerText);\n\nconst footerVersion = document.createElement(\"span\");\nfooterVersion.textContent = \"v0.1.0\";\nfooterVersion.style.color = \"white\";\nfooter.appendChild(footerVersion);\n"},{"id":"form","label":"form.ts","code":"import {TermDOM} from \"@b9g/termdom\";\n\nconst term = new TermDOM();\n\nterm.attach();\nconst {document} = term;\n\nconst style = document.createElement(\"style\");\nstyle.textContent = `\n  .form { padding: 1ch 2ch; }\n  .title { color: cyan; font-weight: bold; }\n  .field { display: flex; flex-direction: row; padding: 1 0 0 0; }\n  .label { color: white; width: 8ch; padding: 1 0 0 0; }\n  input { background: #1d3557; color: white; width: 28ch; }\n  input:focus { background: #264f78; }\n  .preview { color: #888; padding: 1 0 0 0; }\n  .done { color: green; font-weight: bold; padding: 1 0 0 0; }\n  .hint { color: #666; padding: 1 0 0 0; }\n`;\ndocument.head.appendChild(style);\n\nconst form = document.createElement(\"div\");\nform.className = \"form\";\nform.innerHTML = `\n  \u003cdiv class=\"title\">New profile\u003c/div>\n  \u003cdiv class=\"field\">\u003cdiv class=\"label\">Name\u003c/div>\u003cinput id=\"name\" type=\"text\" autofocus>\u003c/div>\n  \u003cdiv class=\"field\">\u003cdiv class=\"label\">Email\u003c/div>\u003cinput id=\"email\" type=\"text\">\u003c/div>\n  \u003cdiv class=\"field\">\u003cdiv class=\"label\">Handle\u003c/div>\u003cinput id=\"handle\" type=\"text\">\u003c/div>\n  \u003cdiv class=\"preview\" id=\"preview\">\u003c/div>\n  \u003cdiv class=\"done\" id=\"done\">\u003c/div>\n  \u003cdiv class=\"hint\">tab next field · enter submit · ctrl+c quit\u003c/div>\n`;\ndocument.body.appendChild(form);\n\nconst fields = [\"name\", \"email\", \"handle\"].map(\n\t(id) => document.getElementById(id) as HTMLInputElement,\n);\nconst preview = document.getElementById(\"preview\")!;\nconst done = document.getElementById(\"done\")!;\n\nfunction updatePreview(): void {\n\tconst [name, email, handle] = fields.map((f) => f.value);\n\tpreview.textContent =\n\t\tname || email || handle ?\n\t\t\t`» ${name || \"?\"} \u003c${email || \"?\"}> @${handle || \"?\"}` :\n\t\t\t\"» start typing to build a profile\";\n\tdone.textContent = \"\";\n}\n\n// The standard event: fires on every edit, in any field.\nfor (const field of fields) {\n\tfield.addEventListener(\"input\", updatePreview);\n}\n\ndocument.addEventListener(\"keydown\", (event: Event) => {\n\tif ((event as KeyboardEvent).key !== \"Enter\") {\n\t\treturn;\n\t}\n\tconst [name, email, handle] = fields.map((f) => f.value.trim());\n\tif (!name && !email && !handle) {\n\t\treturn;\n\t}\n\tdone.textContent = `✓ saved: ${name || \"anonymous\"} \u003c${email || \"n/a\"}> @${handle || \"n/a\"}`;\n});\n\nupdatePreview();\n"},{"id":"fullscreen","label":"fullscreen.ts","code":"import {TermDOM} from \"@b9g/termdom\";\n\nconst term = new TermDOM();\n\nterm.attach();\nconst {document} = term;\n\nconst style = document.createElement(\"style\");\nstyle.textContent = `\n  .page { padding: 1 2ch; }\n  h2 { color: cyan; }\n  .hint { color: #666; }\n  .stage.fs {\n    display: flex; flex-direction: column;\n    align-items: center; justify-content: center;\n    background-color: #001133; color: white;\n  }\n  .stage.fs .big { color: cyan; font-weight: bold; }\n  .stage.fs .clock { color: yellow; }\n  .stage.fs .spinner { color: lightgreen; }\n  .stage.fs .hint { color: #557; }\n`;\ndocument.head.appendChild(style);\n\nconst page = document.createElement(\"div\");\npage.className = \"page\";\npage.innerHTML = `\n  \u003ch2>Fullscreen demo\u003c/h2>\n  \u003cdiv class=\"stage\">\u003cdiv class=\"big\">This element goes fullscreen.\u003c/div>\u003cdiv class=\"clock\">\u003c/div>\u003cdiv class=\"spinner\">\u003c/div>\u003cdiv class=\"hint\">press f\u003c/div>\u003c/div>\n  \u003cdiv class=\"hint\">f toggles fullscreen · q quits\u003c/div>\n`;\ndocument.body.appendChild(page);\n\nconst stage = page.querySelector(\".stage\") as HTMLElement;\nconst clock = stage.querySelector(\".clock\") as HTMLElement;\nconst spinner = stage.querySelector(\".spinner\") as HTMLElement;\nconst hint = stage.querySelector(\".stage .hint\") as HTMLElement;\n\nconst frames = [\"⠋\", \"⠙\", \"⠹\", \"⠸\", \"⠼\", \"⠴\", \"⠦\", \"⠧\", \"⠇\", \"⠏\"];\nlet tick = 0;\nsetInterval(() => {\n\ttick++;\n\tclock.textContent = new Date().toLocaleTimeString();\n\tspinner.textContent = `${frames[tick % frames.length]} live while fullscreen ${frames[tick % frames.length]}`;\n}, 100);\n\ndocument.addEventListener(\"fullscreenchange\", () => {\n\tconst fullscreen = document.fullscreenElement === stage;\n\tstage.classList.toggle(\"fs\", fullscreen);\n\thint.textContent = fullscreen ? \"f returns · q quits\" : \"press f\";\n});\n\n// Keyboard events land on the focused element (or body) and bubble up to\n// the document -- never DOWN into children, so listen here.\ndocument.addEventListener(\"keydown\", async (event: KeyboardEvent) => {\n\tif (event.key === \"q\") {\n\t\tterm.window.close();\n\t}\n\tif (event.key === \"f\") {\n\t\tif (document.fullscreenElement) {\n\t\t\tawait document.exitFullscreen();\n\t\t} else {\n\t\t\tawait stage.requestFullscreen();\n\t\t}\n\t}\n});\n"},{"id":"fuzzy-finder","label":"fuzzy-finder.ts","code":"#!/usr/bin/env node\n// A fuzzy finder, fzf-style, written as a plain web page: a real \u003cinput> filters\n// a list as you type, the arrows move a selection, Enter prints the pick and\n// quits. The list is either the lines of a file you pass, or a recursive listing\n// of the current directory.\n//\n//   node examples/fuzzy-finder.ts [file-with-lines]\n//\n//   type            filter          Up/Down, Ctrl-n/p   move selection\n//   Enter           print & quit    Esc / Ctrl-c        cancel\nimport {TermDOM} from \"@b9g/termdom\";\nimport {readFileSync, readdirSync} from \"node:fs\";\nimport {join} from \"node:path\";\n\n// ---- data source -------------------------------------------------------------\nfunction walk(\n\tdir: string,\n\tprefix: string,\n\tout: string[],\n\tbudget: number,\n): void {\n\tif (out.length >= budget) {\n\t\treturn;\n\t}\n\tlet entries;\n\ttry {\n\t\tentries = readdirSync(dir, {withFileTypes: true});\n\t} catch (_err) {\n\t\treturn;\n\t}\n\tfor (const entry of entries) {\n\t\tif (entry.name === \".git\" || entry.name === \"node_modules\") {\n\t\t\tcontinue;\n\t\t}\n\t\tconst rel = prefix ? `${prefix}/${entry.name}` : entry.name;\n\t\tif (entry.isDirectory()) {\n\t\t\twalk(join(dir, entry.name), rel, out, budget);\n\t\t} else {\n\t\t\tout.push(rel);\n\t\t}\n\t\tif (out.length >= budget) {\n\t\t\treturn;\n\t\t}\n\t}\n}\n\nconst arg = process.argv[2];\nconst items: string[] = [];\nif (arg) {\n\tfor (const line of readFileSync(arg, \"utf8\").split(\"\\n\")) {\n\t\tif (line.trim()) {\n\t\t\titems.push(line);\n\t\t}\n\t}\n} else {\n\twalk(process.cwd(), \"\", items, 5000);\n}\n\n// ---- fuzzy match: subsequence with a light score (earlier, tighter = better) -\nfunction score(item: string, query: string): number | null {\n\tif (!query) {\n\t\treturn 0;\n\t}\n\tconst hay = item.toLowerCase();\n\tconst needle = query.toLowerCase();\n\tlet i = 0;\n\tlet first = -1;\n\tlet last = -1;\n\tfor (let j = 0; j \u003c hay.length && i \u003c needle.length; j++) {\n\t\tif (hay[j] === needle[i]) {\n\t\t\tif (first \u003c 0) {\n\t\t\t\tfirst = j;\n\t\t\t}\n\t\t\tlast = j;\n\t\t\ti++;\n\t\t}\n\t}\n\tif (i \u003c needle.length) {\n\t\treturn null;\n\t}\n\t// Prefer matches that start early and span few characters.\n\treturn first + (last - first);\n}\n\n// ---- DOM ---------------------------------------------------------------------\nconst term = new TermDOM();\nterm.attach();\nconst {document} = term;\n\nconst style = document.createElement(\"style\");\nstyle.textContent = `\n\t.prompt { display: flex; flex-direction: row; }\n\t.prompt .sigil { color: #5fafff; }\n\tinput { flex-grow: 1; }\n\t.status { color: #808080; }\n\t.results { margin-top: 1px; }\n\t.row { }\n\t.row.selected { background-color: #303030; }\n\t.row .mark { display: inline; color: #ff8700; }\n\t.row .text { display: inline; }\n\t.row.selected .text { font-weight: bold; }\n`;\ndocument.head.appendChild(style);\n\nconst prompt = document.createElement(\"div\");\nprompt.className = \"prompt\";\nconst sigil = document.createElement(\"span\");\nsigil.className = \"sigil\";\nsigil.textContent = \"\\u203a\\u00a0\";\nconst input = document.createElement(\"input\");\ninput.autofocus = true;\ninput.setAttribute(\"placeholder\", \"type to filter…\");\nprompt.append(sigil, input);\n\nconst status = document.createElement(\"div\");\nstatus.className = \"status\";\n\nconst results = document.createElement(\"div\");\nresults.className = \"results\";\n\ndocument.body.append(prompt, status, results);\n\nlet matches: string[] = [];\nlet selected = 0;\n\nfunction rows(): HTMLElement[] {\n\treturn Array.from(results.querySelectorAll\u003cHTMLElement>(\".row\"));\n}\n\nfunction render(): void {\n\tconst query = input.value;\n\tmatches = query ?\n\t\t\titems\n\t\t\t\t.map((item) => ({item, s: score(item, query)}))\n\t\t\t\t.filter((m): m is {item: string; s: number} => m.s !== null)\n\t\t\t\t.sort((a, b) => a.s - b.s || a.item.length - b.item.length)\n\t\t\t\t.slice(0, 500)\n\t\t\t\t.map((m) => m.item) :\n\t\t\titems.slice(0, 500); // no query: original order\n\n\tselected = Math.max(0, Math.min(selected, matches.length - 1));\n\tresults.textContent = \"\";\n\tfor (const [i, item] of matches.entries()) {\n\t\tconst row = document.createElement(\"div\");\n\t\trow.className = \"row\";\n\t\tif (i === selected) {\n\t\t\trow.classList.add(\"selected\");\n\t\t}\n\t\tconst mark = document.createElement(\"span\");\n\t\tmark.className = \"mark\";\n\t\tmark.textContent = i === selected ? \"\\u203a\\u00a0\" : \"\\u00a0\\u00a0\";\n\t\tconst text = document.createElement(\"span\");\n\t\ttext.className = \"text\";\n\t\ttext.textContent = item;\n\t\trow.append(mark, text);\n\t\tresults.appendChild(row);\n\t}\n\tstatus.textContent = ` ${matches.length}/${items.length}`;\n}\n\nfunction setSelected(row: HTMLElement | undefined, on: boolean): void {\n\tif (!row) {\n\t\treturn;\n\t}\n\trow.classList.toggle(\"selected\", on);\n\trow.querySelector\u003cHTMLElement>(\".mark\")!.textContent = on ?\n\t\t\"\\u203a\\u00a0\" :\n\t\t\"\\u00a0\\u00a0\";\n}\n\nfunction move(delta: number): void {\n\tif (matches.length === 0) {\n\t\treturn;\n\t}\n\tconst next = Math.max(0, Math.min(selected + delta, matches.length - 1));\n\tif (next === selected) {\n\t\treturn;\n\t}\n\t// Only the two rows that changed: an arrow key is two rows of work, not\n\t// a walk over the whole list.\n\tconst all = rows();\n\tsetSelected(all[selected], false);\n\tsetSelected(all[next], true);\n\tselected = next;\n\tall[selected]?.scrollIntoView();\n}\n\nasync function finish(pick: string | null): Promise\u003cvoid> {\n\t// dispose() resolves once the final flush has reached the terminal, so\n\t// the picked line prints below the paid-out UI, not into it.\n\tawait term.dispose();\n\tif (pick !== null) {\n\t\tprocess.stdout.write(pick + \"\\n\");\n\t}\n\tprocess.exit(pick === null ? 1 : 0);\n}\n\n// Filtering is the input's own `input` event -- the same event a web page hears.\ninput.addEventListener(\"input\", () => {\n\tselected = 0;\n\trender();\n});\n\n// Navigation and commit live at the document level, so they work while the\n// input keeps focus and its own editing keys (text, Backspace, Left/Right).\ndocument.addEventListener(\"keydown\", (event: Event) => {\n\tconst e = event as KeyboardEvent;\n\tconst ctrl = e.ctrlKey;\n\tif (e.key === \"Escape\" || (ctrl && e.key === \"c\")) {\n\t\tvoid finish(null);\n\t} else if (e.key === \"Enter\") {\n\t\tvoid finish(matches[selected] ?? null);\n\t} else if (e.key === \"ArrowDown\" || (ctrl && e.key === \"n\")) {\n\t\tmove(1);\n\t} else if (e.key === \"ArrowUp\" || (ctrl && e.key === \"p\")) {\n\t\tmove(-1);\n\t} else {\n\t\treturn;\n\t}\n\te.preventDefault();\n});\n\nrender();\n\n// Piped or redirected (no terminal): just print the current list and exit, so\n// the example is inspectable without a TTY.\nif (!process.stdout.isTTY) {\n\tterm.window.close();\n}\n"},{"id":"hacker-news","label":"hacker-news.ts","code":"// Hacker News as a page: the front page from the Algolia API, and a story's\n// comment thread rendered from the HTML the API hands back.\n//\n//   node examples/hacker-news.ts\n//\n//   j/k or up/down     move           Enter / l    read the comments\n//   h / left           fold a reply   Backspace    back to the front page\n//   l / right          unfold         space/f/b    page the thread\n//   g / G              ends           r            reload\n//   q                  quit\n//   a click picks a story or a comment; picking a story opens it\n//\n// In a thread, h folds the comment under the cursor. On a comment that is\n// folded already, or that has no replies, h steps up to the parent.\n//\n// The page takes the alternate screen, where Escape belongs to the terminal:\n// it drops the reader back into the scrollback, and the document keeps\n// rendering there in flow.\nimport {TermDOM} from \"@b9g/termdom\";\n\nconst API = \"https://hn.algolia.com/api/v1\";\nconst STORY_COUNT = 30;\n\n// The front_page tag names everything that has been on the front page, which\n// reaches back months. A three-day window is what is on it now.\nconst WINDOW_SECONDS = 3 * 24 * 60 * 60;\n\n// The thread arrives whole, and a busy story carries a thousand comments.\n// Past this many the reader stops building rows and says so.\nconst COMMENT_LIMIT = 250;\n\n// Past this depth replies stop stepping right, so a long argument still\n// leaves room for words at eighty columns.\nconst INDENT_LIMIT = 6;\n\n// A job post carries no points, no author and no comment count, so the\n// fields the meta line reads are optional.\ninterface Hit {\n\ttitle: string;\n\turl: string | null;\n\tpoints?: number;\n\tauthor?: string;\n\tnum_comments?: number;\n\tcreated_at_i: number;\n}\n\n// The search calls a story's id objectID; the item endpoint wants it in a\n// path. Everything below this line calls it id.\ntype Story = Hit & {id: string};\n\ninterface Item {\n\tid: number;\n\tauthor: string | null;\n\ttext: string | null;\n\tcreated_at_i: number;\n\tchildren?: Item[];\n}\n\nconst term = new TermDOM();\nterm.attach();\nconst {document, window} = term;\n\nconst style = document.createElement(\"style\");\nstyle.textContent = `\n\t.masthead {\n\t\tdisplay: flex;\n\t\tflex-direction: row;\n\t\tjustify-content: space-between;\n\t\tbackground-color: #ff6600;\n\t\t/* Near-black rather than black: the engine reads #000000 as the\n\t\t   terminal's default color, which on a dark theme is not dark. */\n\t\tcolor: #1a1a1a;\n\t\tfont-weight: bold;\n\t\tpadding: 0 1ch;\n\t}\n\t.masthead .y { background-color: #ffffff; color: #ff6600; }\n\t.masthead .count { font-weight: normal; }\n\t/* The reader fills the screen and scrolls its content; the bar sits on\n\t   the last row and stays there while the content scrolls under it. */\n\t.reader { overflow-y: auto; }\n\t.hint {\n\t\tposition: fixed;\n\t\tbottom: 0;\n\t\tleft: 0;\n\t\twidth: 100%;\n\t\tbackground-color: #262626;\n\t\tcolor: #9e9e9e;\n\t\tpadding: 0 1ch;\n\t}\n\n\t.story { padding: 0 1ch; }\n\t.headline { display: flex; flex-direction: row; }\n\t.headwords { flex-grow: 1; }\n\t.story .rank { width: 4ch; flex-shrink: 0; color: #828282; }\n\t.story .title { display: inline; }\n\t.story .domain { display: inline; color: #828282; }\n\t.story .meta { color: #828282; padding-left: 4ch; }\n\t.story.on { background-color: #33291a; }\n\t.story.on .rank { color: #ff6600; font-weight: bold; }\n\t.story.on .title { color: #ffffff; font-weight: bold; }\n\n\t.head { padding: 0 1ch; margin-bottom: 1px; }\n\t.head .title { color: #ff6600; font-weight: bold; }\n\t.head .link { color: #6699cc; }\n\t.head .meta { color: #828282; }\n\n\t.comment { padding: 0 1ch; margin-top: 1px; }\n\t.thread { border-left: 1px solid #3a3a3a; padding-left: 1ch; }\n\t.byline { color: #828282; }\n\t.byline .who { color: #b0b0b0; }\n\t.byline .fold { color: #666666; }\n\t.gone { color: #555555; }\n\t.comment.on { background-color: #33291a; }\n\t.comment.on .thread { border-left: 1px solid #ff6600; }\n\t.comment.on .who { color: #ffffff; font-weight: bold; }\n\n\t/* The comment body is HN's own markup: paragraphs, links, italics and\n\t   the occasional code block, parsed and laid out as it stands. */\n\t.body p { margin-top: 1px; }\n\t.body a { color: #6699cc; }\n\t.body i { font-style: italic; }\n\t.body code { color: #ff8c69; }\n\t/* HN quotes code and long quotations in pre; wrapping keeps them on\n\t   screen instead of running off the right edge. */\n\t.body pre {\n\t\tbackground-color: #1c1c1c;\n\t\tcolor: #d0d0d0;\n\t\tpadding: 0 1ch;\n\t\twhite-space: pre-wrap;\n\t}\n\t.body pre code { color: inherit; }\n\n\t.message { padding: 0 1ch; margin-top: 1px; }\n\t.message.loading { color: #828282; }\n\t.message.error { color: #ff5f5f; }\n`;\ndocument.head.appendChild(style);\n\nconst masthead = document.createElement(\"div\");\nmasthead.className = \"masthead\";\nconst brand = document.createElement(\"span\");\nconst logo = document.createElement(\"span\");\nlogo.className = \"y\";\nlogo.textContent = \"Y\";\nconst name = document.createElement(\"span\");\nname.textContent = \" Hacker News\";\nbrand.append(logo, name);\nconst count = document.createElement(\"span\");\ncount.className = \"count\";\nmasthead.append(brand, count);\n\nconst hint = document.createElement(\"div\");\nhint.className = \"hint\";\nconst listView = document.createElement(\"div\");\nconst readerView = document.createElement(\"div\");\nreaderView.style.display = \"none\";\n// The reader takes the screen: the alternate screen keeps a thread out of\n// the scrollback and hands the whole terminal to the page. The content\n// scrolls its content; the fixed bar stays on the last row.\nconst reader = document.createElement(\"div\");\nreader.className = \"reader\";\nreader.append(masthead, listView, readerView, hint);\ndocument.body.appendChild(reader);\nvoid reader.requestFullscreen();\n\nconst LIST_KEYS = \" j/k move · enter comments · g/G ends · r reload · q quit\";\nconst READER_KEYS =\n\t\" j/k move · h/l fold · space page · backspace back · r reload · q quit\";\n\nfunction message(kind: string, text: string): HTMLElement {\n\tconst div = document.createElement(\"div\");\n\tdiv.className = `message ${kind}`;\n\tdiv.textContent = text;\n\treturn div;\n}\n\nfunction plural(n: number, word: string): string {\n\treturn `${n} ${word}${n === 1 ? \"\" : \"s\"}`;\n}\n\n/** How long ago, in the coarsest unit that still says something. */\nfunction age(created: number): string {\n\tconst minutes = Math.max(0, Math.round(Date.now() / 1000 - created) / 60);\n\tif (minutes \u003c 60) {\n\t\treturn `${plural(Math.round(minutes), \"minute\")} ago`;\n\t}\n\tconst hours = minutes / 60;\n\tif (hours \u003c 24) {\n\t\treturn `${plural(Math.round(hours), \"hour\")} ago`;\n\t}\n\treturn `${plural(Math.round(hours / 24), \"day\")} ago`;\n}\n\n/** Points, author, age and comment count, minus whatever the story lacks. */\nfunction metaText(story: Story): string {\n\tconst parts: string[] = [];\n\tif (story.points !== undefined) {\n\t\tparts.push(plural(story.points, \"point\"));\n\t}\n\tif (story.author) {\n\t\tparts.push(`by ${story.author}`);\n\t}\n\tparts.push(age(story.created_at_i));\n\tif (story.num_comments) {\n\t\tparts.push(`· ${plural(story.num_comments, \"comment\")}`);\n\t}\n\treturn parts.join(\" \");\n}\n\nfunction domainOf(url: string | null): string {\n\tif (!url) {\n\t\treturn \"\";\n\t}\n\ttry {\n\t\treturn new URL(url).hostname.replace(/^www\\./, \"\");\n\t} catch (_err) {\n\t\treturn \"\";\n\t}\n}\n\nlet stories: Story[] = [];\nlet selected = 0;\nlet reading: Story | null = null;\n// Bumped by anything that changes what the screen is for, so a fetch that\n// lands after the reader has moved on paints nothing.\nlet generation = 0;\n\n// The thread in reading order, the ids of the comments whose replies are\n// folded away, the thread positions the screen is showing, and the cursor\n// as an offset into that showing list.\nlet thread: Array\u003c[Item, number]> = [];\nconst folded = new Set\u003cnumber>();\nlet showing: number[] = [];\nlet picked = 0;\n\n/** Whichever list the cursor is walking: stories, or the comments on screen. */\nfunction rows(): HTMLElement[] {\n\tconst view = reading ? readerView : listView;\n\tconst selector = reading ? \".comment\" : \".story\";\n\treturn Array.from(view.querySelectorAll\u003cHTMLElement>(selector));\n}\n\nfunction cursor(): number {\n\treturn reading ? picked : selected;\n}\n\nfunction makeRow(story: Story, index: number): HTMLElement {\n\tconst row = document.createElement(\"div\");\n\trow.className = \"story\";\n\t// The rank is its own flex column so a title that wraps hangs under\n\t// itself rather than under the number.\n\tconst headline = document.createElement(\"div\");\n\theadline.className = \"headline\";\n\tconst rank = document.createElement(\"span\");\n\trank.className = \"rank\";\n\trank.textContent = `${String(index + 1).padStart(2)}.`;\n\tconst headwords = document.createElement(\"span\");\n\theadwords.className = \"headwords\";\n\tconst title = document.createElement(\"span\");\n\ttitle.className = \"title\";\n\ttitle.textContent = story.title;\n\theadwords.appendChild(title);\n\tconst domain = domainOf(story.url);\n\tif (domain) {\n\t\tconst site = document.createElement(\"span\");\n\t\tsite.className = \"domain\";\n\t\tsite.textContent = ` (${domain})`;\n\t\theadwords.appendChild(site);\n\t}\n\theadline.append(rank, headwords);\n\tconst meta = document.createElement(\"div\");\n\tmeta.className = \"meta\";\n\tmeta.textContent = metaText(story);\n\trow.append(headline, meta);\n\treturn row;\n}\n\nfunction select(index: number): void {\n\tconst all = rows();\n\tconst at = Math.max(0, Math.min(index, all.length - 1));\n\tif (reading) {\n\t\tpicked = at;\n\t} else {\n\t\tselected = at;\n\t}\n\tall.forEach((row, i) => row.classList.toggle(\"on\", i === at));\n\tcount.textContent = all.length ? `${at + 1}/${all.length}` : \"\";\n}\n\n/** The rows above the bar, which holds the last one. */\nfunction page(): number {\n\treturn Math.max(1, window.innerHeight - 1);\n}\n\n/**\n * Scroll the reader the least it takes to bring a row above the bar.\n * scrollIntoView reveals to the screen edge, where the bar would cover the\n * row, so the last row is reserved here instead.\n */\nfunction reveal(row: HTMLElement): void {\n\tconst rect = row.getBoundingClientRect();\n\tif (rect.top \u003c 0) {\n\t\treader.scrollBy(0, rect.top);\n\t} else if (rect.bottom > page()) {\n\t\treader.scrollBy(0, rect.bottom - page());\n\t}\n}\n\nfunction refresh(): void {\n\t// At the first row, pull the reader the rest of the way up so the\n\t// masthead shows too -- a reveal alone stops below it.\n\tif (cursor() === 0) {\n\t\treader.scrollTo(0, 0);\n\t\treturn;\n\t}\n\tconst row = rows()[cursor()];\n\tif (row) {\n\t\treveal(row);\n\t}\n}\n\nasync function loadStories(): Promise\u003cvoid> {\n\tconst mine = ++generation;\n\treading = null;\n\treaderView.style.display = \"none\";\n\tlistView.style.display = \"\";\n\thint.textContent = LIST_KEYS;\n\tcount.textContent = \"\";\n\tlistView.replaceChildren(message(\"loading\", \"loading the front page…\"));\n\treader.scrollTo(0, 0);\n\ttry {\n\t\tconst since = Math.round(Date.now() / 1000) - WINDOW_SECONDS;\n\t\tconst response = await fetch(\n\t\t\t`${API}/search?tags=front_page&hitsPerPage=${STORY_COUNT}` +\n\t\t\t`&numericFilters=${encodeURIComponent(`created_at_i>${since}`)}`,\n\t\t);\n\t\tif (!response.ok) {\n\t\t\tthrow new Error(`the API answered ${response.status}`);\n\t\t}\n\t\tconst data = (await response.json()) as {\n\t\t\thits: Array\u003cHit & Record\u003c\"objectID\", string>>;\n\t\t};\n\t\tif (mine !== generation) {\n\t\t\treturn;\n\t\t}\n\t\tstories = (data.hits ?? []).map((hit) => ({...hit, id: hit.objectID}));\n\t\tif (!stories.length) {\n\t\t\tlistView.replaceChildren(\n\t\t\t\tmessage(\"error\", \"the front page came back empty\"),\n\t\t\t);\n\t\t\treturn;\n\t\t}\n\t\tlistView.replaceChildren(...stories.map(makeRow));\n\t\tselect(Math.min(selected, stories.length - 1));\n\t\trefresh();\n\t} catch (_err) {\n\t\tif (mine === generation) {\n\t\t\tlistView.replaceChildren(\n\t\t\t\tmessage(\n\t\t\t\t\t\"error\",\n\t\t\t\t\t\"the front page is unreachable — press r to try again\",\n\t\t\t\t),\n\t\t\t);\n\t\t}\n\t}\n}\n\nfunction storyHead(story: Story): HTMLElement {\n\tconst head = document.createElement(\"div\");\n\thead.className = \"head\";\n\tconst title = document.createElement(\"div\");\n\ttitle.className = \"title\";\n\ttitle.textContent = story.title;\n\thead.appendChild(title);\n\tif (story.url) {\n\t\tconst link = document.createElement(\"div\");\n\t\tlink.className = \"link\";\n\t\tlink.textContent = story.url;\n\t\thead.appendChild(link);\n\t}\n\tconst meta = document.createElement(\"div\");\n\tmeta.className = \"meta\";\n\tmeta.textContent = metaText(story);\n\thead.appendChild(meta);\n\treturn head;\n}\n\n/** The thread in reading order, each reply paired with its depth. */\nfunction flatten(item: Item, depth: number, out: Array\u003c[Item, number]>): void {\n\tfor (const child of item.children ?? []) {\n\t\tif (out.length >= COMMENT_LIMIT) {\n\t\t\treturn;\n\t\t}\n\t\tout.push([child, depth]);\n\t\tflatten(child, depth + 1, out);\n\t}\n}\n\n/** How many replies hang under a thread position, down to the last of them. */\nfunction replyCount(at: number): number {\n\tconst depth = thread[at][1];\n\tlet n = 0;\n\tfor (let i = at + 1; i \u003c thread.length && thread[i][1] > depth; i++) {\n\t\tn++;\n\t}\n\treturn n;\n}\n\n/** The thread position a reply hangs from, or -1 at the top of the thread. */\nfunction parentOf(at: number): number {\n\tconst depth = thread[at][1];\n\tfor (let i = at - 1; i >= 0; i--) {\n\t\tif (thread[i][1] \u003c depth) {\n\t\t\treturn i;\n\t\t}\n\t}\n\treturn -1;\n}\n\n/** The thread minus the replies under folded comments, in reading order. */\nfunction unfolded(): number[] {\n\tconst out: number[] = [];\n\t// Depth of the folded comment whose replies are being skipped, or -1\n\t// while nothing is being skipped.\n\tlet under = -1;\n\tfor (let i = 0; i \u003c thread.length; i++) {\n\t\tconst depth = thread[i][1];\n\t\tif (under >= 0 && depth > under) {\n\t\t\tcontinue;\n\t\t}\n\t\tunder = -1;\n\t\tout.push(i);\n\t\tif (folded.has(thread[i][0].id)) {\n\t\t\tunder = depth;\n\t\t}\n\t}\n\treturn out;\n}\n\nfunction makeComment(item: Item, depth: number, hidden: number): HTMLElement {\n\tconst comment = document.createElement(\"div\");\n\tcomment.className = \"comment\";\n\tcomment.style.paddingLeft = `${1 + Math.min(depth, INDENT_LIMIT) * 2}ch`;\n\tconst rail = document.createElement(\"div\");\n\trail.className = \"thread\";\n\tconst byline = document.createElement(\"div\");\n\tbyline.className = \"byline\";\n\tif (item.author) {\n\t\tconst who = document.createElement(\"span\");\n\t\twho.className = \"who\";\n\t\twho.textContent = item.author;\n\t\tconst when = document.createElement(\"span\");\n\t\twhen.textContent = ` · ${age(item.created_at_i)}`;\n\t\tbyline.append(who, when);\n\t} else {\n\t\tbyline.classList.add(\"gone\");\n\t\tbyline.textContent = \"[deleted]\";\n\t}\n\tif (hidden > 0) {\n\t\tconst marker = document.createElement(\"span\");\n\t\tmarker.className = \"fold\";\n\t\tmarker.textContent = ` [+${hidden}]`;\n\t\tbyline.appendChild(marker);\n\t}\n\trail.appendChild(byline);\n\tif (item.text) {\n\t\tconst body = document.createElement(\"div\");\n\t\tbody.className = \"body\";\n\t\tbody.innerHTML = item.text;\n\t\trail.appendChild(body);\n\t}\n\tcomment.appendChild(rail);\n\treturn comment;\n}\n\n/**\n * Repaints the thread from the fold state and puts the cursor back on the\n * comment at `target`, or on the nearest parent still on screen.\n */\nfunction paintThread(story: Story, target: number): void {\n\tshowing = unfolded();\n\tconst parts: HTMLElement[] = [storyHead(story)];\n\tif (!thread.length) {\n\t\tparts.push(message(\"loading\", \"no comments yet\"));\n\t}\n\tfor (const at of showing) {\n\t\tconst [item, depth] = thread[at];\n\t\tparts.push(\n\t\t\tmakeComment(item, depth, folded.has(item.id) ? replyCount(at) : 0),\n\t\t);\n\t}\n\tif (thread.length >= COMMENT_LIMIT) {\n\t\tparts.push(message(\"loading\", `the first ${COMMENT_LIMIT} comments`));\n\t}\n\treaderView.replaceChildren(...parts);\n\tlet at = target;\n\twhile (at >= 0 && !showing.includes(at)) {\n\t\tat = parentOf(at);\n\t}\n\tselect(Math.max(0, showing.indexOf(at)));\n\trefresh();\n}\n\nfunction unfold(story: Story): void {\n\tconst at = showing[picked];\n\tif (at === undefined || !folded.has(thread[at][0].id)) {\n\t\treturn;\n\t}\n\tfolded.delete(thread[at][0].id);\n\tpaintThread(story, at);\n}\n\nfunction fold(story: Story): void {\n\tconst at = showing[picked];\n\tif (at === undefined) {\n\t\treturn;\n\t}\n\tconst id = thread[at][0].id;\n\tif (!folded.has(id) && replyCount(at) > 0) {\n\t\tfolded.add(id);\n\t\tpaintThread(story, at);\n\t\treturn;\n\t}\n\tconst parent = parentOf(at);\n\tif (parent >= 0) {\n\t\tselect(showing.indexOf(parent));\n\t\trefresh();\n\t}\n}\n\nasync function openThread(story: Story): Promise\u003cvoid> {\n\tconst mine = ++generation;\n\treading = story;\n\tthread = [];\n\tshowing = [];\n\tpicked = 0;\n\tfolded.clear();\n\tlistView.style.display = \"none\";\n\treaderView.style.display = \"\";\n\thint.textContent = READER_KEYS;\n\tcount.textContent = plural(story.num_comments ?? 0, \"comment\");\n\treaderView.replaceChildren(\n\t\tstoryHead(story),\n\t\tmessage(\"loading\", \"loading the comments…\"),\n\t);\n\treader.scrollTo(0, 0);\n\ttry {\n\t\tconst response = await fetch(`${API}/items/${story.id}`);\n\t\tif (!response.ok) {\n\t\t\tthrow new Error(`the API answered ${response.status}`);\n\t\t}\n\t\tconst item = (await response.json()) as Item;\n\t\tif (mine !== generation) {\n\t\t\treturn;\n\t\t}\n\t\tthread = [];\n\t\tflatten(item, 0, thread);\n\t\tpaintThread(story, 0);\n\t\treader.scrollTo(0, 0);\n\t} catch (_err) {\n\t\tif (mine === generation) {\n\t\t\treaderView.replaceChildren(\n\t\t\t\tstoryHead(story),\n\t\t\t\tmessage(\"error\", \"the comments are unreachable — press r to try again\"),\n\t\t\t);\n\t\t}\n\t}\n}\n\nfunction back(): void {\n\tgeneration++;\n\treading = null;\n\treaderView.style.display = \"none\";\n\tlistView.style.display = \"\";\n\thint.textContent = LIST_KEYS;\n\t// The thread left the reader deep in its own rows; the front page starts\n\t// from its masthead and comes down to the story that was open.\n\treader.scrollTo(0, 0);\n\tselect(selected);\n\trefresh();\n}\n\n// Escape is the terminal's key, and it drops the page out of the alternate\n// screen. Back at the top, the document prints into the scrollback from its\n// first row.\ndocument.addEventListener(\"fullscreenchange\", () => {\n\tif (!document.fullscreenElement) {\n\t\treader.scrollTo(0, 0);\n\t}\n});\n\n// A narrower terminal rewraps into more rows, a shorter one shows fewer:\n// either way the reader re-aims at the row under the cursor.\nwindow.addEventListener(\"resize\", () => {\n\trefresh();\n});\n\ndocument.addEventListener(\"keydown\", (event: Event) => {\n\tconst key = (event as KeyboardEvent).key;\n\tif (key === \"q\") {\n\t\tterm.window.close();\n\t\treturn;\n\t}\n\tif (reading) {\n\t\tif (key === \"Backspace\") {\n\t\t\tback();\n\t\t} else if (key === \"r\") {\n\t\t\tvoid openThread(reading);\n\t\t} else if (key === \"j\" || key === \"ArrowDown\") {\n\t\t\tselect(picked + 1);\n\t\t\trefresh();\n\t\t} else if (key === \"k\" || key === \"ArrowUp\") {\n\t\t\tselect(picked - 1);\n\t\t\trefresh();\n\t\t} else if (key === \"h\" || key === \"ArrowLeft\") {\n\t\t\tfold(reading);\n\t\t} else if (key === \"l\" || key === \"ArrowRight\") {\n\t\t\tunfold(reading);\n\t\t} else if (key === \" \" || key === \"f\" || key === \"PageDown\") {\n\t\t\treader.scrollBy(0, page());\n\t\t} else if (key === \"b\" || key === \"PageUp\") {\n\t\t\treader.scrollBy(0, -page());\n\t\t} else if (key === \"g\") {\n\t\t\tselect(0);\n\t\t\trefresh();\n\t\t} else if (key === \"G\") {\n\t\t\tselect(rows().length - 1);\n\t\t\trefresh();\n\t\t}\n\t\treturn;\n\t}\n\tif (key === \"r\") {\n\t\tvoid loadStories();\n\t} else if (key === \"j\" || key === \"ArrowDown\") {\n\t\tselect(selected + 1);\n\t\trefresh();\n\t} else if (key === \"k\" || key === \"ArrowUp\") {\n\t\tselect(selected - 1);\n\t\trefresh();\n\t} else if (key === \"g\") {\n\t\tselect(0);\n\t\trefresh();\n\t} else if (key === \"G\") {\n\t\tselect(rows().length - 1);\n\t\trefresh();\n\t} else if (key === \"Enter\" || key === \"l\" || key === \"ArrowRight\") {\n\t\tconst story = stories[selected];\n\t\tif (story) {\n\t\t\tvoid openThread(story);\n\t\t}\n\t}\n});\n\ndocument.addEventListener(\"click\", (event: Event) => {\n\tconst target = event.target as Element;\n\tif (reading) {\n\t\tconst comment = target.closest(\".comment\") as HTMLElement | null;\n\t\tif (comment) {\n\t\t\tselect(rows().indexOf(comment));\n\t\t\trefresh();\n\t\t}\n\t\treturn;\n\t}\n\tconst row = target.closest(\".story\") as HTMLElement | null;\n\tif (!row) {\n\t\treturn;\n\t}\n\tselect(rows().indexOf(row));\n\tconst story = stories[selected];\n\tif (story) {\n\t\tvoid openThread(story);\n\t}\n});\n\nvoid loadStories();\n"},{"id":"lists","label":"lists.ts","code":"import {TermDOM} from \"@b9g/termdom\";\n\nconst term = new TermDOM();\n\nterm.attach();\nconst {document} = term;\nconst style = document.createElement(\"style\");\nstyle.textContent = `\nul {\n\tlist-style-position: outside !important;\n}\n`;\ndocument.body.appendChild(style);\n\n// Create a comprehensive lists demo\nconst container = document.createElement(\"div\");\n\n// Title\nconst title = document.createElement(\"h1\");\ntitle.textContent = \"📝 Comprehensive Lists Demo\";\ntitle.style.color = \"cyan\";\ncontainer.appendChild(title);\n\n// Basic unordered list\nconst basicSection = document.createElement(\"section\");\nconst basicTitle = document.createElement(\"h2\");\nbasicTitle.textContent = \"Basic Unordered List\";\nbasicTitle.style.color = \"yellow\";\nbasicSection.appendChild(basicTitle);\n\nconst basicUl = document.createElement(\"ul\");\n[\"First item\", \"Second item\", \"Third item\"].forEach((text) => {\n\tconst li = document.createElement(\"li\");\n\tli.textContent = text;\n\tbasicUl.appendChild(li);\n});\nbasicSection.appendChild(basicUl);\ncontainer.appendChild(basicSection);\n\n// Basic ordered list\nconst orderedSection = document.createElement(\"section\");\nconst orderedTitle = document.createElement(\"h2\");\norderedTitle.textContent = \"Basic Ordered List\";\norderedTitle.style.color = \"yellow\";\norderedSection.appendChild(orderedTitle);\n\nconst basicOl = document.createElement(\"ol\");\n[\"First step\", \"Second step\", \"Third step\"].forEach((text) => {\n\tconst li = document.createElement(\"li\");\n\tli.textContent = text;\n\tbasicOl.appendChild(li);\n});\norderedSection.appendChild(basicOl);\ncontainer.appendChild(orderedSection);\n\n// Different list style types\nconst stylesSection = document.createElement(\"section\");\nconst stylesTitle = document.createElement(\"h2\");\nstylesTitle.textContent = \"List Style Types\";\nstylesTitle.style.color = \"yellow\";\nstylesSection.appendChild(stylesTitle);\n\n// Disc style\nconst discUl = document.createElement(\"ul\");\ndiscUl.style.listStyleType = \"disc\";\n[\"Disc item 1\", \"Disc item 2\"].forEach((text) => {\n\tconst li = document.createElement(\"li\");\n\tli.textContent = text;\n\tdiscUl.appendChild(li);\n});\nstylesSection.appendChild(discUl);\n\n// Circle style\nconst circleUl = document.createElement(\"ul\");\ncircleUl.style.listStyleType = \"circle\";\n[\"Circle item 1\", \"Circle item 2\"].forEach((text) => {\n\tconst li = document.createElement(\"li\");\n\tli.textContent = text;\n\tcircleUl.appendChild(li);\n});\nstylesSection.appendChild(circleUl);\n\n// Square style\nconst squareUl = document.createElement(\"ul\");\nsquareUl.style.listStyleType = \"square\";\n[\"Square item 1\", \"Square item 2\"].forEach((text) => {\n\tconst li = document.createElement(\"li\");\n\tli.textContent = text;\n\tsquareUl.appendChild(li);\n});\nstylesSection.appendChild(squareUl);\n\n// Decimal style\nconst decimalOl = document.createElement(\"ol\");\ndecimalOl.style.listStyleType = \"decimal\";\n[\"Decimal item 1\", \"Decimal item 2\"].forEach((text) => {\n\tconst li = document.createElement(\"li\");\n\tli.textContent = text;\n\tdecimalOl.appendChild(li);\n});\nstylesSection.appendChild(decimalOl);\n\n// Lower alpha style\nconst alphaOl = document.createElement(\"ol\");\nalphaOl.style.listStyleType = \"lower-alpha\";\n[\"Alpha item 1\", \"Alpha item 2\", \"Alpha item 3\"].forEach((text) => {\n\tconst li = document.createElement(\"li\");\n\tli.textContent = text;\n\talphaOl.appendChild(li);\n});\nstylesSection.appendChild(alphaOl);\n\n// Roman style\nconst romanOl = document.createElement(\"ol\");\nromanOl.style.listStyleType = \"lower-roman\";\n[\"Roman item 1\", \"Roman item 2\", \"Roman item 3\"].forEach((text) => {\n\tconst li = document.createElement(\"li\");\n\tli.textContent = text;\n\tromanOl.appendChild(li);\n});\nstylesSection.appendChild(romanOl);\ncontainer.appendChild(stylesSection);\n\n// NESTED LISTS\nconst nestedSection = document.createElement(\"section\");\nconst nestedTitle = document.createElement(\"h2\");\nnestedTitle.textContent = \"Nested Lists\";\nnestedTitle.style.color = \"yellow\";\nnestedSection.appendChild(nestedTitle);\n\n// Simple nested example\nconst nestedUl = document.createElement(\"ul\");\n\nconst item1 = document.createElement(\"li\");\nitem1.textContent = \"Main Item 1\";\nnestedUl.appendChild(item1);\n\nconst item2 = document.createElement(\"li\");\nitem2.textContent = \"Main Item 2 with nested list:\";\n\n// Nested list inside item2\nconst subList = document.createElement(\"ul\");\nconst subItem1 = document.createElement(\"li\");\nsubItem1.textContent = \"Sub Item 1\";\nconst subItem2 = document.createElement(\"li\");\nsubItem2.textContent = \"Sub Item 2\";\nsubList.appendChild(subItem1);\nsubList.appendChild(subItem2);\nitem2.appendChild(subList);\n\nnestedUl.appendChild(item2);\n\nconst item3 = document.createElement(\"li\");\nitem3.textContent = \"Main Item 3\";\nnestedUl.appendChild(item3);\n\nnestedSection.appendChild(nestedUl);\ncontainer.appendChild(nestedSection);\n\n// Complex nested example\nconst complexSection = document.createElement(\"section\");\nconst complexTitle = document.createElement(\"h2\");\ncomplexTitle.textContent = \"Complex Nested Structure\";\ncomplexTitle.style.color = \"yellow\";\ncomplexSection.appendChild(complexTitle);\n\nconst complexUl = document.createElement(\"ul\");\n\n// Main item with multiple levels\nconst complexItem = document.createElement(\"li\");\ncomplexItem.textContent = \"Development Process\";\n\nconst level1Ol = document.createElement(\"ol\");\n\nconst planItem = document.createElement(\"li\");\nplanItem.textContent = \"Planning\";\nconst planSubUl = document.createElement(\"ul\");\n[\n\t\"Requirements gathering\",\n\t\"Architecture design\",\n\t\"Timeline estimation\",\n].forEach((text) => {\n\tconst li = document.createElement(\"li\");\n\tli.textContent = text;\n\tplanSubUl.appendChild(li);\n});\nplanItem.appendChild(planSubUl);\nlevel1Ol.appendChild(planItem);\n\nconst devItem = document.createElement(\"li\");\ndevItem.textContent = \"Development\";\nconst devSubUl = document.createElement(\"ul\");\n[\"Frontend implementation\", \"Backend services\", \"Database design\"].forEach(\n\t(text) => {\n\t\tconst li = document.createElement(\"li\");\n\t\tli.textContent = text;\n\t\tdevSubUl.appendChild(li);\n\t},\n);\ndevItem.appendChild(devSubUl);\nlevel1Ol.appendChild(devItem);\n\nconst testItem = document.createElement(\"li\");\ntestItem.textContent = \"Testing & Deployment\";\nlevel1Ol.appendChild(testItem);\n\ncomplexItem.appendChild(level1Ol);\ncomplexUl.appendChild(complexItem);\ncomplexSection.appendChild(complexUl);\ncontainer.appendChild(complexSection);\n\n// Mixed ordered/unordered nesting\nconst mixedSection = document.createElement(\"section\");\nconst mixedTitle = document.createElement(\"h2\");\nmixedTitle.textContent = \"Mixed Ordered/Unordered Nesting\";\nmixedTitle.style.color = \"yellow\";\nmixedSection.appendChild(mixedTitle);\n\nconst mixedOl = document.createElement(\"ol\");\n\nconst setupItem = document.createElement(\"li\");\nsetupItem.textContent = \"Setup\";\nconst setupUl = document.createElement(\"ul\");\n[\"Install dependencies\", \"Configure environment\", \"Initialize project\"].forEach(\n\t(text) => {\n\t\tconst li = document.createElement(\"li\");\n\t\tli.textContent = text;\n\t\tsetupUl.appendChild(li);\n\t},\n);\nsetupItem.appendChild(setupUl);\nmixedOl.appendChild(setupItem);\n\nconst codeItem = document.createElement(\"li\");\ncodeItem.textContent = \"Write Code\";\nconst codeUl = document.createElement(\"ul\");\n[\"Implement features\", \"Write tests\", \"Debug issues\"].forEach((text) => {\n\tconst li = document.createElement(\"li\");\n\tli.textContent = text;\n\tcodeUl.appendChild(li);\n});\ncodeItem.appendChild(codeUl);\nmixedOl.appendChild(codeItem);\n\nconst deployItem = document.createElement(\"li\");\ndeployItem.textContent = \"Deploy\";\nmixedOl.appendChild(deployItem);\n\nmixedSection.appendChild(mixedOl);\ncontainer.appendChild(mixedSection);\n\ndocument.body.appendChild(container);\n\n// close() paints the frame, pays the whole document out to scrollback,\n// restores the terminal, and exits.\nterm.window.close();\n"},{"id":"markdown","label":"markdown.ts","code":"import {TermDOM} from \"@b9g/termdom\";\nimport {marked} from \"marked\";\nimport {markedHighlight} from \"marked-highlight\";\nimport {readFileSync} from \"node:fs\";\n\n// Prism is a browser syntax highlighter; here it tokenises fenced code blocks\n// into \u003cspan class=\"token ...\"> markup that the theme below colours. Each pack\n// registers its grammar on the Prism it is imported beside; CSS and JavaScript\n// ship in Prism's core, so only the rest need a line here.\nimport Prism from \"prismjs\";\nimport \"prismjs/components/prism-typescript.js\";\nimport \"prismjs/components/prism-json.js\";\nimport \"prismjs/components/prism-bash.js\";\nimport \"prismjs/components/prism-python.js\";\n\n// marked and marked-highlight are standard Node/browser libraries used here\n// completely unmodified -- the whole point: a real web toolchain feeding a real\n// DOM. marked-highlight routes each code block through Prism.\nmarked.use(\n\tmarkedHighlight({\n\t\thighlight(code: string, lang: string): string {\n\t\t\tconst grammar = Prism.languages[lang];\n\t\t\tif (grammar) {\n\t\t\t\treturn Prism.highlight(code, grammar, lang);\n\t\t\t}\n\t\t\treturn code\n\t\t\t\t.replace(/&/g, \"&amp;\")\n\t\t\t\t.replace(/\u003c/g, \"&lt;\")\n\t\t\t\t.replace(/>/g, \"&gt;\");\n\t\t},\n\t}),\n);\n\n// The sample document, inline: the example is self-contained -- one file to\n// read, one to run, no sidecar to locate at runtime.\nconst SAMPLE = `# Markdown in the Terminal\n\nA single document that exercises the whole element set, rendered from real\nMarkdown through the **marked** library into a real DOM.\n\n## Inline formatting\n\nText can be **bold**, *italic*, ***both***, \\`inline code\\`, ~~struck through~~,\nand a [labelled link](https://example.com). Links are underlined by the user\nagent; Tab through the document to see a focus ring land on each one.\n\n### Third-level heading\n#### Fourth-level heading\n##### Fifth-level heading\n###### Sixth-level heading\n\n## Lists\n\nAn unordered list, with nesting:\n\n- First item\n- Second item\n  - A nested item\n  - Another, with \\`code\\`\n- Third item\n\nAn ordered list:\n\n1. Parse the Markdown\n2. Build the DOM\n3. Render to cells\n\nA task list (GitHub-flavoured, rendered as real checkboxes):\n\n- [x] Write the parser adapter\n- [x] Style the headings\n- [x] Add a fixed status line\n\n## Blockquote\n\n> The best way to predict the future is to invent it.\n>\n> Simple things should be simple, complex things should be possible.\n\n## Code block\n\n\\`\\`\\`js\nfunction greet(name) {\n  return \\`Hello, \\${name}!\\`;\n}\nconsole.log(greet(\"world\"));\n\\`\\`\\`\n\nSyntax highlighting comes from Prism, another unmodified web library, across\nlanguages:\n\n\\`\\`\\`json\n{\n  \"name\": \"termdom\",\n  \"renders\": [\"markdown\", \"code\"],\n  \"highlighted\": true\n}\n\\`\\`\\`\n\n## Table\n\nElement     | Display    | Notes                       |\n----------- | ---------- | --------------------------- |\n\\`h1\\`–\\`h6\\`   | block      | themed bold, coloured       |\n\\`blockquote\\`| block      | left rule via \\`border-left\\` |\n\\`pre\\`       | block      | dark background, monospace  |\n\\`table\\`     | table      | ruled by the UA stylesheet  |\n\n## Horizontal rule\n\nAbove the rule.\n\n---\n\nBelow the rule.\n\n## Wrapping\n\nThis final paragraph is deliberately long so that it wraps across several\nterminal columns, demonstrating that inline text reflows to the viewport width\njust as it would in a browser, breaking on word boundaries rather than spilling\noff the right edge of the screen.\n`;\n\nconst file = process.argv[2];\nconst source = file ? readFileSync(file, \"utf8\") : SAMPLE;\nconst html = marked.parse(source, {async: false}) as string;\n\nconst term = new TermDOM();\n\nterm.attach();\nconst {document, window} = term;\n\n// A compact terminal theme. The UA sheet already makes links underlined and\n// tables ruled; this adds the heading hierarchy, code and blockquote styling a\n// Markdown reader wants. Everything here is ordinary author CSS.\nconst style = document.createElement(\"style\");\nstyle.textContent = `\n\tarticle { padding: 0 1ch; }\n\th1, h2, h3, h4, h5, h6 { font-weight: bold; margin-top: 1px; }\n\th1 { color: #ff8700; text-decoration: underline; }\n\th2 { color: #ffaf00; }\n\th3 { color: #ffd700; }\n\th4, h5, h6 { color: #afaf00; }\n\tp { margin-top: 1px; }\n\ta { color: #5fafff; }\n\tcode { color: #ff5f5f; }\n\tpre { background-color: #1c1c1c; color: #d0d0d0; padding: 0 1ch; margin-top: 1px; }\n\tpre code { color: inherit; background-color: transparent; }\n\tli:has(> input[type=\"checkbox\"]) { list-style: none; }\n\n\t/* Prism token theme (Monokai-ish), scoped to highlighted code. */\n\t.token.comment, .token.prolog, .token.doctype, .token.cdata { color: #75715e; }\n\t.token.punctuation { color: #808080; }\n\t.token.property, .token.tag, .token.constant, .token.symbol { color: #f92672; }\n\t.token.boolean, .token.number { color: #ae81ff; }\n\t.token.selector, .token.attr-name, .token.string, .token.char, .token.builtin { color: #a6e22e; }\n\t.token.operator, .token.entity, .token.url { color: #d0d0d0; }\n\t.token.atrule, .token.attr-value, .token.keyword { color: #66d9ef; }\n\t.token.function, .token.class-name { color: #e6db74; }\n\t.token.regex, .token.important, .token.variable { color: #fd971f; }\n\tblockquote { border-left: 1px solid #5f5f5f; padding-left: 1ch; color: #8a8a8a; margin-top: 1px; }\n\tul, ol { margin-top: 1px; }\n\tli > ul, li > ol { margin-top: 0; }\n\thr { color: #444444; margin-top: 1px; }\n\tth { font-weight: bold; color: #ffd700; }\n\tdel { text-decoration: line-through; }\n\n\t/* The pager's status line: position: fixed pins it to the VIEWPORT, so\n\t   the camera scrolls the document underneath it -- the same contract as\n\t   a web page's sticky footer. The body pads for it, as a web page pads\n\t   for its own fixed footer, so the last line can scroll clear of it. */\n\tbody { padding-bottom: 1px; }\n\t.status {\n\t\tposition: fixed;\n\t\tbottom: 0;\n\t\tleft: 0;\n\t\twidth: 100%;\n\t\tbackground-color: #262626;\n\t\tcolor: #9e9e9e;\n\t\tpadding: 0 1ch;\n\t}\n\t.status .pct { position: absolute; right: 1ch; top: 0; color: #ffd700; }\n`;\ndocument.head.appendChild(style);\n\nconst article = document.createElement(\"article\");\narticle.innerHTML = html;\ndocument.body.appendChild(article);\n\n// Wait one frame before measuring. The flow-or-pager decision below compares\n// the document's height to the window's, and a transport that settles its\n// size after attach (the browser playground's does) reports the real\n// geometry only after the first frame.\nawait new Promise\u003cvoid>((r) => window.requestAnimationFrame(() => r()));\n\n// Flow mode: a page that fits (or output that isn't a terminal, e.g. piped to a\n// file) just prints and exits -- dispose pays the whole document out to the\n// terminal's scrollback on the way.\nconst fits = document.body.scrollHeight \u003c= window.innerHeight;\nif (!process.stdout.isTTY || fits) {\n\tterm.window.close();\n}\n\n// Pager mode: the document is taller than the screen, so move the camera over\n// it. window.scrollBy IS the camera (clamped to the document), so this is the\n// same scrolling any web page gets -- no terminal-specific plumbing.\nfunction page(): number {\n\treturn Math.max(1, window.innerHeight - 1);\n}\nfunction height(): number {\n\treturn document.body.scrollHeight;\n}\n\n// The status line the sample's own task list asked for.\nconst status = document.createElement(\"div\");\nstatus.className = \"status\";\nconst statusName = document.createElement(\"span\");\nstatusName.textContent = `${file?.split(\"/\").pop() ?? \"sample\"} · j/k scroll · q quit`;\nconst pct = document.createElement(\"span\");\npct.className = \"pct\";\nstatus.append(statusName, pct);\ndocument.body.appendChild(status);\n\nfunction updateStatus(): void {\n\tconst max = Math.max(1, height() - window.innerHeight);\n\tpct.textContent = `${Math.min(100, Math.round((window.scrollY / max) * 100))}%`;\n}\nupdateStatus();\nconst bindings: Record\u003cstring, () => void> = {\n\t\"q\": () => {\n\t\tterm.window.close();\n\t},\n\t\" \": () => window.scrollBy(0, page()),\n\t\"f\": () => window.scrollBy(0, page()),\n\t\"PageDown\": () => window.scrollBy(0, page()),\n\t\"b\": () => window.scrollBy(0, -page()),\n\t\"PageUp\": () => window.scrollBy(0, -page()),\n\t\"j\": () => window.scrollBy(0, 1),\n\t\"ArrowDown\": () => window.scrollBy(0, 1),\n\t\"k\": () => window.scrollBy(0, -1),\n\t\"ArrowUp\": () => window.scrollBy(0, -1),\n\t\"g\": () => window.scrollBy(0, -height()),\n\t\"G\": () => window.scrollBy(0, height()),\n};\ndocument.addEventListener(\"keydown\", (event: Event) => {\n\tbindings[(event as KeyboardEvent).key]?.();\n\tupdateStatus();\n});\n"},{"id":"password","label":"password.ts","code":"// Adapted from https://backbonenotbad.hyperclay.com/\n// https://gist.github.com/panphora/8f4d620ae92e8b28dcb4f20152185749\nimport {TermDOM} from \"@b9g/termdom\";\nimport type {Context} from \"@b9g/crank\";\nimport {jsx} from \"@b9g/crank/standalone\";\nimport {renderer} from \"@b9g/crank/dom\";\n\nconst term = new TermDOM();\n\nterm.attach();\nconst document = term.document;\n\nconst style = document.createElement(\"style\");\nstyle.textContent = `\n\t.card { border: 1px solid #5f5f5f; padding: 0 2ch; width: 40ch; margin: 1px 0 0 1ch; }\n\t.card h1 { color: cyan; font-weight: bold; }\n\t.card input { width: 100%; margin-top: 1px; }\n\t.reqs { margin-top: 1px; }\n\t.req .mark { display: inline; }\n\t.req.met .mark, .req.met .label { color: #5faf5f; }\n\t.req.met .label { font-weight: bold; }\n\t.req:not(.met) .mark, .req:not(.met) .label { color: #666666; }\n`;\ndocument.head.appendChild(style);\n\ninterface Requirement {\n\tlabel: string;\n\tcheck: (pwd: string) => boolean;\n}\n\nconst requirements: Requirement[] = [\n\t{label: \"8+ characters\", check: (pwd) => pwd.length >= 8},\n\t{label: \"12+ characters\", check: (pwd) => pwd.length >= 12},\n\t{label: \"Lowercase letter\", check: (pwd) => /[a-z]/.test(pwd)},\n\t{label: \"Uppercase letter\", check: (pwd) => /[A-Z]/.test(pwd)},\n\t{label: \"Number\", check: (pwd) => /\\d/.test(pwd)},\n\t{label: \"Special character\", check: (pwd) => /[^a-zA-Z0-9]/.test(pwd)},\n];\n\nfunction* PasswordStrength(this: Context) {\n\tlet password = \"\";\n\n\tconst oninput = (ev: any) => {\n\t\tthis.refresh(() => (password = ev.target.value));\n\t};\n\n\t// Idiomatic Crank: this yields the component's props each iteration; {}\n\t// says none are used.\n\n\tfor ({} of this) {\n\t\tyield jsx`\n\t\t\t\u003cdiv class=\"card\">\n\t\t\t\t\u003ch1>Password strength\u003c/h1>\n\t\t\t\t\u003cinput\n\t\t\t\t\ttype=\"password\"\n\t\t\t\t\tvalue=${password}\n\t\t\t\t\toninput=${oninput}\n\t\t\t\t\tplaceholder=\"Enter password\"\n\t\t\t\t\tautofocus\n\t\t\t\t/>\n\t\t\t\t\u003cdiv class=\"reqs\">\n\t\t\t\t\t${requirements.map(({label, check}) => {\n\t\t\t\t\t\tconst met = check(password);\n\t\t\t\t\t\treturn jsx`\n\t\t\t\t\t\t\t\u003cdiv class=${{req: true, met}} key=${label}>\n\t\t\t\t\t\t\t\t\u003cspan class=\"mark\">${met ? \"✓\" : \"○\"} \u003c/span>\u003cspan class=\"label\">${label}\u003c/span>\n\t\t\t\t\t\t\t\u003c/div>\n\t\t\t\t\t\t`;\n\t\t\t\t\t})}\n\t\t\t\t\u003c/div>\n\t\t\t\u003c/div>\n\t\t`;\n\t}\n}\n\nrenderer.render(jsx`\u003c${PasswordStrength} />`, document.body);\n\ndocument.addEventListener(\n\t\"keydown\",\n\t(event: Event) => {\n\t\tconst e = event as KeyboardEvent;\n\t\tif (e.key === \"Escape\" || (e.ctrlKey && e.key === \"c\")) {\n\t\t\tterm.window.close();\n\t\t}\n\t},\n\ttrue,\n);\n\n// No terminal (piped/CI): show the card mid-typing, then exit.\nif (!process.stdout.isTTY) {\n\tconst input = document.querySelector(\"input\") as HTMLInputElement;\n\tinput.value = \"Tr0ub4dor\";\n\tinput.dispatchEvent(new term.window.Event(\"input\", {bubbles: true}));\n\tsetTimeout(() => {\n\t\tterm.window.close();\n\t}, 100);\n}\n"},{"id":"prism","label":"prism.ts","code":"/**\n * Syntax highlighting by Prism, the browser library, unmodified. It arrives\n * through the imports a web page writes: the library, then a grammar pack.\n *\n * Prism turns source text into markup -- `\u003cspan class=\"token keyword\">`,\n * `\u003cspan class=\"token string\">`, one class per kind of token. The stylesheet\n * below is a Prism CSS theme (Tomorrow Night), whose rules match those\n * classes and nothing else. TermDOM lays the markup out under the theme and\n * paints the result as cells. A web highlighter and a web stylesheet, drawn\n * in a terminal.\n *\n * Keys: left/right arrows or 1-4 pick the language, q quits.\n */\nimport {TermDOM} from \"@b9g/termdom\";\nimport Prism from \"prismjs\";\n\n// Each pack registers its grammar on the Prism it is imported beside. CSS and\n// JavaScript ship in Prism's core, so only the rest need a line here.\nimport \"prismjs/components/prism-typescript.js\";\nimport \"prismjs/components/prism-json.js\";\nimport \"prismjs/components/prism-python.js\";\n\ninterface Sample {\n\tid: string;\n\tlabel: string;\n\tcode: string;\n}\n\n// Samples are inline: nothing is read from disk, so the example runs in the\n// browser playground as well as a terminal. Lines stay under 64 columns so\n// they fit an 80-column screen beside the gutter.\nconst SAMPLES: Sample[] = [\n\t{\n\t\tid: \"typescript\",\n\t\tlabel: \"TypeScript\",\n\t\tcode: `// Types are erased before the program runs. Tokens are not.\ninterface Point {\n  x: number;\n  y: number;\n}\n\nconst ORIGIN: Point = {x: 0, y: 0};\n\nexport function distance(a: Point, b: Point = ORIGIN): number {\n  const dx = a.x - b.x;\n  const dy = a.y - b.y;\n  return Math.sqrt(dx * dx + dy * dy);\n}\n\nconst points:
