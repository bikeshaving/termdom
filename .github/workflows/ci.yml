name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun typecheck

      - name: lib.dom drift
        run: bun drift

      - name: Lint
        run: bun lint

  # Node exercises the pure-JS fallbacks (stringWidth, color) that bun's
  # native paths would otherwise hide. The node floor in package.json
  # engines and the newest release: the floor leg is what holds engines
  # honest.
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20.19", 26]
    steps:
      # A Windows runner would otherwise check the sources and fixtures
      # out with CRLF line endings.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - run: bun install --frozen-lockfile

      # libuild's executable is a shell script, which npx can't start on
      # Windows.
      # A file that waits on thousands of frames takes Node several times as
      # long on the Windows runners.
      - name: Test on Node
        run: node node_modules/@b9g/libuild/cli.js test -p node --timeout ${{ runner.os == 'Windows' && 600000 || 180000 }}

  bun:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Test on Bun
        run: bun node_modules/@b9g/libuild/cli.js test -p bun --timeout 180000

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: bun install --frozen-lockfile

      - name: Test on Deno
        run: npx libuild test -p deno --timeout 180000

  # src/generated/ has one author per file: its generator. This job reruns
  # the hermetic generators and fails on any drift -- a hand edit to a
  # generated file, or a generator change without its regenerated output.
  # widthtables.ts is excluded: its input is the UCD, fetched, not vendored.
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Regenerate
        run: |
          npx tsx scripts/generate-css-properties.ts
          npx tsx scripts/generate-html-idl.ts
          npx tsx scripts/generate-dom-idl.ts

      - name: Diff
        run: git diff --exit-code src/generated/cssproperties.ts src/generated/htmlidl.ts src/generated/domidl.ts

  # termdom is developed under Bun, so nothing in `bun test` ever executes the
  # pure-JS fallbacks in src/runtime.ts. A regression there is invisible to the
  # whole suite and misrenders text on every runtime except the one we develop
  # on. These jobs render a document with the compiled library and check it.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Smoke test on Node
        run: node scripts/smoke.js

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke test on Deno
        run: deno run -A --node-modules-dir=manual scripts/smoke.js
