name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The node floor in package.json engines and the newest release. The
    # floor leg is what holds engines honest.
    strategy:
      matrix:
        node: [20, 26]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun typecheck

      - name: Lint
        run: bun lint

      # Node exercises the pure-JS fallbacks (stringWidth, color) that bun's
      # native paths would otherwise hide.
      - name: Test on Node
        run: npx libuild test -p node

      # Bun ships one version, so its half of the suite runs once.
      - name: Test on Bun
        if: matrix.node == 26
        run: npx libuild test -p bun

  # src/generated/ has one author per file: its generator. This job reruns
  # the hermetic generators and fails on any drift -- a hand edit to a
  # generated file, or a generator change without its regenerated output.
  # widthtables.ts is excluded: its input is the UCD, fetched, not vendored.
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Regenerate
        run: npx tsx scripts/generate-css-properties.ts

      - name: Diff
        run: git diff --exit-code src/generated/cssproperties.ts

  # termdom is developed under Bun, so nothing in `bun test` ever executes the
  # pure-JS fallbacks in src/runtime.ts. A regression there is invisible to the
  # whole suite and misrenders text on every runtime except the one we develop
  # on. These jobs render a document with the compiled library and check it.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Smoke test on Node
        run: node scripts/smoke.js

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke test on Deno
        run: deno run -A --node-modules-dir=manual scripts/smoke.js
