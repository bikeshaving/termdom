name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun typecheck

      - name: Lint
        run: bun lint

      # Batched, not a single `bun test`: the whole suite in one process hits a
      # memory ceiling and gets killed with no summary. See scripts/test.sh.
      - name: Test
        run: bun run test:ci

  # termdom is developed under Bun, so nothing in `bun test` ever executes the
  # pure-JS fallbacks in src/runtime.ts. A regression there is invisible to the
  # whole suite and misrenders text on every runtime except the one we develop
  # on. These jobs render a document with the compiled library and check it.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test on Node
        run: node scripts/smoke.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke test on Deno
        run: deno run -A --node-modules-dir=manual scripts/smoke.mjs
