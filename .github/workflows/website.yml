name: Website

# termdom.org is the static site in website/, published to the gh-pages
# branch. Every push to main rebuilds it: the examples page bundles the engine
# and seeds its filesystem from the examples and guides, so a change almost
# anywhere in the repository changes the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26

      # The site imports the engine from ../src, so both trees install.
      - run: bun install --frozen-lockfile

      - run: bun install --frozen-lockfile
        working-directory: website

      - name: Build
        run: npm run static
        working-directory: website

      - name: Check links
        run: npm run check-links
        working-directory: website

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/dist/public
          cname: termdom.org
