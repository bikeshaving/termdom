name: Release

# Publishing a GitHub Release stages the version on npm with provenance.
# It goes live only when a person runs `npm stage approve`, which asks
# for 2FA.

on:
  release:
    types: [published]

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Staged publishing needs npm 11.15 or later.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run test

      - name: Check the tag matches the version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package version $PKG"
            exit 1
          fi

      - run: npx libuild stage
